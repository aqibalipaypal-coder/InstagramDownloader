name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install required Android SDK packages
        run: |
          export ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Install Gradle 8.7
        run: |
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d $HOME
          echo "$HOME/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Run unit tests
        run: |
          export ANDROID_HOME=${ANDROID_HOME}
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          gradle testDebugUnitTest --no-daemon --stacktrace
          echo "Unit tests completed successfully"

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

      - name: Build Debug APK
        if: success()
        run: |
          export ANDROID_HOME=${ANDROID_HOME}
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists and is valid
        if: success()
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file not found at $APK"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: APK is suspiciously small ($SIZE bytes)"
            exit 1
          fi
          MAGIC=$(python3 -c "print(open('$APK','rb').read(4).hex())")
          echo "APK size: $SIZE bytes"
          echo "APK magic (hex): $MAGIC"
          if [ "$MAGIC" != "504b0304" ]; then
            echo "ERROR: APK does not have valid ZIP/APK magic bytes"
            exit 1
          fi
          ls -lh "$APK"
          echo "APK verification passed"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: InstagramDownloader-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
